services:

  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:18
    container_name: progress-tracker-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: progress_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d progress_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # -------------------------
  # Database migrations
  # -------------------------
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    image: progress-tracker-bot:latest
    container_name: progress-tracker-migrations
    command: ["migrations/ProgressTrackerBot.Migrations.dll"]
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy


  # -------------------------
  # Telegram bot
  # -------------------------
  bot:
    image: progress-tracker-bot:latest
    container_name: progress-tracker-bot
    command: ["host/ProgressTrackerBot.Host.dll"]
    restart: unless-stopped
    init: true
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully


# -------------------------
# Persistent volumes
# -------------------------
volumes:
  postgres_data: